<!doctype html>
<html lang="en" data-skin="minimal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bowling Tracker</title>
  <meta name="description" content="Track bowling scores, feet position, target arrow and more, ball by ball.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

  <div id="toast">
    <span class="toast-msg" role="status" aria-live="polite"></span>
    <button type="button" class="toast-x" aria-label="Dismiss message">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
    </button>
  </div>
  <div id="flash" aria-hidden="true"></div>

  <dialog id="infoDialog">
    <h3></h3>
    <p></p>
    <button type="button" class="btn primary block" data-close>Got it</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
